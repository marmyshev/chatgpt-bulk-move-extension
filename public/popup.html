<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bulk move chats</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>Bulk move chats</h1>

    <p class="hint">
      Opens a selection panel inside the ChatGPT tab. Chats are listed and moved through
      ChatGPT's own backend API.
    </p>

    <label>
      Delay between moves (ms)
      <input id="delayMs" type="number" min="0" max="10000" step="50" value="400" />
    </label>

    <div class="actions">
      <button id="open">Open panel</button>
      <button id="stop" class="danger" disabled>Stop</button>
    </div>

    <pre id="status">Ready.</pre>
  </main>
  <script src="popup.js"></script>
</body>
</html>
